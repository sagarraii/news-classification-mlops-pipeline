model_evaluation:
  root_dir: artifacts/evaluation 

  evaluation_report_path: artifacts/evaluation/report/evaluation_report.yaml # report
  classification_report_path: artifacts/evaluation/report/classification_report.yaml # report
  confusion_matrix_path: artifacts/evaluation/plot/confusion_matrix.png # plot
  evaluation_summary_path: artifacts/evaluation/report/evaluation_summary.yaml # report
  threshold_analysis_path: artifacts/evaluation/report/threshold_analysis.yaml # report

  
