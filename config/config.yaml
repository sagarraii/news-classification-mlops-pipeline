data_ingestion:
  dataset_name: "sh0416/ag_news"
  dataset_download_dir: data/raw
  train_dataset: train
  test_dataset: test



data_validation:
  root_dir: artifacts/data_validation

  STATUS_FILE: artifacts/data_validation/status.txt
  dataset_path: data/raw/train.csv



text_preprocessor:
  root_dir: artifacts/text_preprocessor



feature_builder:
  root_dir: artifacts/feature_builder
  vectorizer_path: artifacts/data_transformation/vectorizers/tfidf_vectorizer.pkl



data_transformation:
  root_dir: artifacts/data_transformation

  train_path: data/raw/train.csv

  processed_train_data_path: data/processed/X_train.npz
  processed_validation_data_path: data/processed/X_validation.npz
  processed_test_data_path: data/processed/X_test.npz

  processed_train_target_path: data/processed/Y_train.npy
  processed_validation_target_path: data/processed/Y_validation.npy
  processed_test_target_path: data/processed/Y_test.npy

# ----------MODEL TRAINER------------

traditional_model_trainer:
  root_dir: artifacts/traditional_model_trainer 
  # trained_models_dir: artifacts/traditional_model_trainer/models # subfolder models All trained model will be saved here (optional)

  best_model_path: artifacts/traditional_model_trainer/best_model.pkl
  best_params_path: artifacts/traditional_model_trainer/best_params.yaml
  model_report_path: artifacts/traditional_model_trainer/model_report.yaml

  search_results_dir: artifacts/traditional_model_trainer/search_results 

